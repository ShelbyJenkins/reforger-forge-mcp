name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Check before writing so a deleted generated artifact cannot hide as an
      # untracked file from the subsequent Git dirty-diff assertion.
      - run: npm run protocol:check

      - run: npm run lint:unused

      - run: npm run protocol:generate

      - run: git diff --exit-code -- observer/protocol

      - run: npm run build

      - run: npm test

      # Run the installed-tarball smoke once rather than packing and installing
      # the same artifact for every matrix entry.
      - if: matrix.node-version == 20
        run: npm run test:package
